<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="auctionBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b09"/>
      <stop offset="100%" stop-color="#0f1913"/>
    </linearGradient>
    <filter id="auctionShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#auctionBgGrad)"/>

  <!-- Main Window -->
  <g filter="url(#auctionShadow)">
    <rect x="50" y="40" width="1180" height="640" rx="10" fill="#111a14" stroke="#1f3626" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <rect x="50" y="40" width="1180" height="42" rx="10" fill="#09120c"/>
    <rect x="50" y="72" width="1180" height="10" fill="#09120c"/>
    
    <!-- Window Controls -->
    <circle cx="75" cy="61" r="6" fill="#ef4444"/>
    <circle cx="95" cy="61" r="6" fill="#fbbf24"/>
    <circle cx="115" cy="61" r="6" fill="#22c55e"/>

    <!-- URL Bar -->
    <rect x="220" y="49" width="740" height="24" rx="6" fill="#132418" stroke="#1f3626" stroke-width="1"/>
    <text x="590" y="66" fill="#86efac" font-size="12" text-anchor="middle" font-family="monospace">https://riyal-auction.vercel.app</text>

    <!-- Header / Auction Status Banner -->
    <rect x="50" y="82" width="1180" height="50" fill="#102016" stroke="#1f3626" stroke-width="1"/>
    <text x="80" y="113" fill="#ffffff" font-size="16" font-weight="bold">⚡ riyal_auction</text>
    
    <rect x="240" y="96" width="110" height="22" rx="4" fill="#1f1111" stroke="#ef4444" stroke-width="1"/>
    <circle cx="252" cy="107" r="3.5" fill="#ef4444"/>
    <text x="262" y="111" fill="#fca5a5" font-size="11" font-weight="bold">LIVE AUCTION</text>

    <rect x="365" y="96" width="130" height="22" rx="4" fill="#182d20"/>
    <text x="375" y="111" fill="#86efac" font-size="11">Spectators: 142 live</text>

    <!-- Center Card: Currently Auctioned Football Player -->
    <rect x="75" y="150" width="460" height="500" rx="10" fill="#0b140e" stroke="#1f3626"/>
    
    <!-- Player Card Header -->
    <rect x="95" y="170" width="420" height="260" rx="8" fill="#14261b" stroke="#2a4c36"/>
    <text x="120" y="210" fill="#fbbf24" font-size="28" font-weight="800">92</text>
    <text x="120" y="230" fill="#86efac" font-size="13" font-weight="bold">ST</text>
    
    <text x="305" y="235" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">Marco Silva</text>
    <text x="305" y="260" fill="#94a3b8" font-size="13" text-anchor="middle">Forward • FC Titans</text>

    <!-- Player Stats Badges -->
    <g transform="translate(115, 290)" font-family="monospace" font-size="13" font-weight="bold">
      <text x="20" y="20" fill="#86efac">94 PAC</text>
      <text x="110" y="20" fill="#86efac">91 SHO</text>
      <text x="200" y="20" fill="#86efac">88 PAS</text>
      <text x="20" y="55" fill="#86efac">89 DRI</text>
      <text x="110" y="55" fill="#86efac">72 DEF</text>
      <text x="200" y="55" fill="#86efac">84 PHY</text>
    </g>

    <!-- Bidding info below player card -->
    <rect x="95" y="450" width="420" height="90" rx="8" fill="#14261b" stroke="#1f3626"/>
    <text x="115" y="480" fill="#94a3b8" font-size="12">CURRENT HIGHEST BID</text>
    <text x="115" y="520" fill="#4ade80" font-size="28" font-weight="800">450,000 Riyals</text>
    <text x="360" y="515" fill="#fbbf24" font-size="13" font-weight="600">by Team Phoenix</text>

    <!-- Timer -->
    <rect x="95" y="560" width="420" height="40" rx="6" fill="#1f1509" stroke="#f59e0b" stroke-width="1"/>
    <text x="305" y="585" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">⏳ 00:14 Remaining on Clock</text>

    <!-- Right Column: Live Bid Feed & Captain Controls -->
    <rect x="560" y="150" width="650" height="500" rx="10" fill="#0b140e" stroke="#1f3626"/>
    
    <text x="585" y="185" fill="#ffffff" font-size="15" font-weight="bold">LIVE AUCTION BID STREAM</text>
    <text x="1110" y="185" fill="#86efac" font-size="12" text-anchor="end" font-family="monospace">Server-Authoritative</text>

    <!-- Bid Feed -->
    <g transform="translate(585, 210)">
      <!-- Bid item 1 -->
      <rect x="0" y="0" width="600" height="60" rx="6" fill="#132418" stroke="#22c55e" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="14" fill="#22c55e"/>
      <text x="30" y="35" fill="#000" font-size="12" font-weight="bold" text-anchor="middle">★</text>
      <text x="60" y="27" fill="#ffffff" font-size="14" font-weight="bold">Team Phoenix bid 450,000 Riyals</text>
      <text x="60" y="47" fill="#86efac" font-size="11">Captain: Zaid • Just now (Accepted by Server)</text>

      <!-- Bid item 2 -->
      <rect x="0" y="75" width="600" height="60" rx="6" fill="#101d14" stroke="#1f3626"/>
      <text x="60" y="102" fill="#e2e8f0" font-size="14">Vanguard FC bid 420,000 Riyals</text>
      <text x="60" y="122" fill="#64748b" font-size="11">Captain: Marcus • 12s ago</text>

      <!-- Bid item 3 -->
      <rect x="0" y="150" width="600" height="60" rx="6" fill="#101d14" stroke="#1f3626"/>
      <text x="60" y="177" fill="#e2e8f0" font-size="14">Team Phoenix bid 380,000 Riyals</text>
      <text x="60" y="197" fill="#64748b" font-size="11">Captain: Zaid • 28s ago</text>

      <!-- Bid item 4 -->
      <rect x="0" y="225" width="600" height="60" rx="6" fill="#101d14" stroke="#1f3626"/>
      <text x="60" y="252" fill="#e2e8f0" font-size="14">Red Hawks bid 350,000 Riyals</text>
      <text x="60" y="272" fill="#64748b" font-size="11">Opening Bid • 45s ago</text>
    </g>

    <!-- Live Captain Bidding Actions -->
    <rect x="585" y="525" width="600" height="105" rx="8" fill="#132418" stroke="#22c55e"/>
    <text x="605" y="555" fill="#ffffff" font-size="13" font-weight="bold">TEAM CAPTAIN ACTION PANEL (Team Phoenix)</text>
    <text x="1165" y="555" fill="#86efac" font-size="12" text-anchor="end">Virtual Balance: 3,200,000 Riyals</text>

    <rect x="605" y="575" width="180" height="40" rx="6" fill="#22c55e"/>
    <text x="695" y="600" fill="#052e16" font-size="13" font-weight="bold" text-anchor="middle">+10,000 Riyals</text>

    <rect x="800" y="575" width="180" height="40" rx="6" fill="#15803d"/>
    <text x="890" y="600" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">+25,000 Riyals</text>

    <rect x="995" y="575" width="190" height="40" rx="6" fill="#166534"/>
    <text x="1090" y="600" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">+50,000 Riyals</text>
  </g>
</svg>
