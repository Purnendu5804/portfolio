<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="rceBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#111420"/>
    </linearGradient>
    <filter id="rceShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#rceBgGrad)"/>

  <!-- Main Window -->
  <g filter="url(#rceShadow)">
    <rect x="50" y="40" width="1180" height="640" rx="10" fill="#131620" stroke="#2a3042" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <rect x="50" y="40" width="1180" height="42" rx="10" fill="#0c0e14"/>
    <rect x="50" y="72" width="1180" height="10" fill="#0c0e14"/>
    
    <!-- Window Controls -->
    <circle cx="75" cy="61" r="6" fill="#ef4444"/>
    <circle cx="95" cy="61" r="6" fill="#fbbf24"/>
    <circle cx="115" cy="61" r="6" fill="#22c55e"/>

    <!-- URL / Header -->
    <text x="640" y="65" fill="#94a3b8" font-size="13" text-anchor="middle" font-weight="600" font-family="monospace">RCE Engine — Sandboxed Remote Code Execution Platform</text>

    <!-- App Sub-header / Metrics Bar -->
    <rect x="50" y="82" width="1180" height="48" fill="#181c28" stroke="#232838" stroke-width="1"/>
    
    <!-- Badges -->
    <rect x="75" y="94" width="135" height="24" rx="4" fill="#091d11" stroke="#22c55e" stroke-width="1"/>
    <text x="142" y="110" fill="#4ade80" font-size="11" font-weight="600" text-anchor="middle">🛡️ ISOLATED CGROUP</text>

    <rect x="222" y="94" width="115" height="24" rx="4" fill="#1b1c24"/>
    <text x="279" y="110" fill="#cbd5e1" font-size="11" text-anchor="middle">RAM: 128 MB Cap</text>

    <rect x="349" y="94" width="115" height="24" rx="4" fill="#1b1c24"/>
    <text x="406" y="110" fill="#cbd5e1" font-size="11" text-anchor="middle">PIDs: 64 Cap</text>

    <rect x="476" y="94" width="145" height="24" rx="4" fill="#1b1c24"/>
    <text x="548" y="110" fill="#ef4444" font-size="11" text-anchor="middle">🚫 ZERO NETWORK</text>

    <!-- Queue status -->
    <rect x="1000" y="94" width="205" height="24" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="1102" y="110" fill="#60a5fa" font-size="11" font-family="monospace" text-anchor="middle">BullMQ Queue: IDLE</text>

    <!-- Editor Left Half -->
    <rect x="70" y="146" width="600" height="505" rx="8" fill="#0b0e14" stroke="#202636"/>
    
    <!-- Editor Tab Bar -->
    <rect x="70" y="146" width="600" height="34" rx="8" fill="#111520"/>
    <rect x="70" y="172" width="600" height="8" fill="#111520"/>
    <rect x="80" y="152" width="130" height="26" rx="4" fill="#0b0e14"/>
    <text x="145" y="169" fill="#38bdf8" font-size="12" font-family="monospace" text-anchor="middle">solution.py</text>
    <text x="230" y="169" fill="#64748b" font-size="12" font-family="monospace">main.cpp</text>
    <text x="310" y="169" fill="#64748b" font-size="12" font-family="monospace">index.ts</text>

    <!-- Code content -->
    <g font-family="monospace" font-size="13" line-height="1.6">
      <text x="90" y="215" fill="#64748b">1</text>
      <text x="120" y="215" fill="#f43f5e">import</text>
      <text x="175" y="215" fill="#e2e8f0">sys, os</text>

      <text x="90" y="245" fill="#64748b">2</text>
      
      <text x="90" y="275" fill="#64748b">3</text>
      <text x="120" y="275" fill="#38bdf8">def</text>
      <text x="155" y="275" fill="#a78bfa">compute_sandboxed_result</text>
      <text x="360" y="275" fill="#e2e8f0">(n: int) -&gt; int:</text>

      <text x="90" y="305" fill="#64748b">4</text>
      <text x="150" y="305" fill="#64748b"># Processed safely inside throwaway Docker worker</text>

      <text x="90" y="335" fill="#64748b">5</text>
      <text x="150" y="335" fill="#f43f5e">if</text>
      <text x="175" y="335" fill="#e2e8f0">n &lt;= 1:</text>
      <text x="245" y="335" fill="#f43f5e">return</text>
      <text x="300" y="335" fill="#fbbf24">n</text>

      <text x="90" y="365" fill="#64748b">6</text>
      <text x="150" y="365" fill="#f43f5e">return</text>
      <text x="205" y="365" fill="#e2e8f0">compute_sandboxed_result(n - 1) + compute_sandboxed_result(n - 2)</text>

      <text x="90" y="405" fill="#64748b">7</text>
      <text x="120" y="405" fill="#f43f5e">if</text>
      <text x="145" y="405" fill="#e2e8f0">__name__ == </text>
      <text x="250" y="405" fill="#4ade80">"__main__"</text>
      <text x="335" y="405" fill="#e2e8f0">:</text>

      <text x="90" y="435" fill="#64748b">8</text>
      <text x="150" y="435" fill="#38bdf8">print</text>
      <text x="195" y="435" fill="#e2e8f0">(compute_sandboxed_result(12))</text>
    </g>

    <!-- Run / Submit Button inside Editor -->
    <rect x="520" y="595" width="130" height="38" rx="6" fill="#2563eb"/>
    <text x="585" y="619" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">▶ RUN CODE</text>

    <!-- Terminal Output Right Half -->
    <rect x="690" y="146" width="518" height="505" rx="8" fill="#0b0e14" stroke="#202636"/>
    
    <!-- Terminal Header -->
    <rect x="690" y="146" width="518" height="34" rx="8" fill="#111520"/>
    <rect x="690" y="172" width="518" height="8" fill="#111520"/>
    <text x="710" y="168" fill="#94a3b8" font-size="12" font-family="monospace">EXECUTION TERMINAL (CONTAINER STDOUT)</text>

    <!-- Terminal lines -->
    <g font-family="monospace" font-size="12" line-height="1.7">
      <text x="710" y="215" fill="#38bdf8">[API Gateway]</text>
      <text x="825" y="215" fill="#cbd5e1">POST /submit payload: 284 bytes</text>

      <text x="710" y="245" fill="#a78bfa">[BullMQ Queue]</text>
      <text x="835" y="245" fill="#cbd5e1">Enqueued job uuid-98b7-4a01</text>

      <text x="710" y="275" fill="#f59e0b">[Worker Daemon]</text>
      <text x="845" y="275" fill="#cbd5e1">Spawning container: sandbox-py311</text>

      <text x="710" y="305" fill="#64748b">----------------------------------------------------</text>
      <text x="710" y="335" fill="#22c55e">✓ Container allocated: 128MB RAM, 64 PIDs, network=none</text>
      <text x="710" y="365" fill="#22c55e">✓ Execution time: 32ms</text>
      <text x="710" y="395" fill="#22c55e">✓ Peak memory: 18.4 MB / 128 MB</text>
      <text x="710" y="425" fill="#64748b">----------------------------------------------------</text>

      <text x="710" y="465" fill="#ffffff" font-weight="bold">STDOUT:</text>
      <text x="710" y="495" fill="#4ade80" font-size="15" font-weight="bold">144</text>

      <text x="710" y="540" fill="#38bdf8">[Database Sync]</text>
      <text x="840" y="540" fill="#cbd5e1">Saved run status: SUCCESS in PostgreSQL</text>
      <text x="710" y="570" fill="#22c55e">[Cleanup]</text>
      <text x="785" y="570" fill="#cbd5e1">Container removed. Temp workspace destroyed.</text>
    </g>
  </g>
</svg>
