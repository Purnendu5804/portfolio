<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#121620"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b202c"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Browser Chrome Window -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="1180" height="640" rx="10" fill="#161b24" stroke="#2d3748" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <rect x="50" y="40" width="1180" height="42" rx="10" fill="#0f131a"/>
    <rect x="50" y="72" width="1180" height="10" fill="#0f131a"/>
    
    <!-- Window Controls -->
    <circle cx="75" cy="61" r="6" fill="#ef4444"/>
    <circle cx="95" cy="61" r="6" fill="#fbbf24"/>
    <circle cx="115" cy="61" r="6" fill="#22c55e"/>

    <!-- URL Bar -->
    <rect x="220" y="49" width="740" height="24" rx="6" fill="#1b202c" stroke="#2d3748" stroke-width="1"/>
    <text x="590" y="66" fill="#8b949e" font-size="12" text-anchor="middle" font-family="monospace">https://sdc-house.vercel.app</text>

    <!-- Top Navigation inside App -->
    <rect x="50" y="82" width="1180" height="50" fill="#141822" stroke="#232936" stroke-width="1"/>
    <text x="80" y="113" fill="#ffffff" font-size="16" font-weight="bold">sdcHouse</text>
    <rect x="180" y="96" width="90" height="22" rx="4" fill="#091d11" stroke="#22c55e" stroke-width="1"/>
    <circle cx="192" cy="107" r="3.5" fill="#22c55e"/>
    <text x="202" y="111" fill="#4ade80" font-size="11" font-weight="600">ONLINE: 8</text>
    <rect x="280" y="96" width="130" height="22" rx="4" fill="#1f2430"/>
    <text x="290" y="111" fill="#94a3b8" font-size="11">Latency: 8ms STUN</text>

    <!-- App Body: Virtual 2D Room Grid -->
    <rect x="70" y="150" width="790" height="500" rx="8" fill="#0d1117" stroke="#232936"/>
    
    <!-- Floor tiles / isometric grid lines -->
    <g stroke="#1a202c" stroke-width="1" opacity="0.6">
      <line x1="70" y1="200" x2="860" y2="200"/>
      <line x1="70" y1="250" x2="860" y2="250"/>
      <line x1="70" y1="300" x2="860" y2="300"/>
      <line x1="70" y1="350" x2="860" y2="350"/>
      <line x1="70" y1="400" x2="860" y2="400"/>
      <line x1="70" y1="450" x2="860" y2="450"/>
      <line x1="70" y1="500" x2="860" y2="500"/>
      <line x1="70" y1="550" x2="860" y2="550"/>
      <line x1="70" y1="600" x2="860" y2="600"/>
      <line x1="170" y1="150" x2="170" y2="650"/>
      <line x1="270" y1="150" x2="270" y2="650"/>
      <line x1="370" y1="150" x2="370" y2="650"/>
      <line x1="470" y1="150" x2="470" y2="650"/>
      <line x1="570" y1="150" x2="570" y2="650"/>
      <line x1="670" y1="150" x2="670" y2="650"/>
      <line x1="770" y1="150" x2="770" y2="650"/>
    </g>

    <!-- Furniture / Zones in space -->
    <rect x="180" y="240" width="160" height="100" rx="8" fill="#161b24" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="260" y="295" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle">🛋️ Lounge Zone</text>

    <rect x="520" y="380" width="180" height="120" rx="8" fill="#161b24" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="610" y="445" fill="#a78bfa" font-size="13" font-weight="600" text-anchor="middle">🎯 Tech Stage</text>

    <!-- Avatars with speech bubbles -->
    <!-- Avatar 1: Purnendu -->
    <g transform="translate(420, 310)">
      <circle cx="20" cy="20" r="18" fill="#3b82f6"/>
      <text x="20" y="25" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">P</text>
      <rect x="-10" y="44" width="60" height="18" rx="4" fill="#111827"/>
      <text x="20" y="56" fill="#fff" font-size="10" text-anchor="middle">Purnendu</text>
      <!-- Speech bubble -->
      <rect x="-40" y="-35" width="120" height="26" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="20" y="-18" fill="#f8fafc" font-size="11" text-anchor="middle">WebRTC connected!</text>
    </g>

    <!-- Avatar 2 -->
    <g transform="translate(560, 260)">
      <circle cx="20" cy="20" r="18" fill="#10b981"/>
      <text x="20" y="25" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">A</text>
      <rect x="-5" y="44" width="50" height="18" rx="4" fill="#111827"/>
      <text x="20" y="56" fill="#fff" font-size="10" text-anchor="middle">Alex</text>
    </g>

    <!-- Right Sidebar: Audio/Video Peer Tiles & Live Chat -->
    <rect x="880" y="150" width="330" height="500" rx="8" fill="#141822" stroke="#232936"/>
    
    <!-- Peer Video Tiles -->
    <text x="898" y="178" fill="#94a3b8" font-size="12" font-weight="bold">VOICE &amp; VIDEO PEERS</text>
    <rect x="898" y="195" width="140" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
    <circle cx="968" cy="235" r="16" fill="#3b82f6"/>
    <text x="968" y="240" fill="#fff" font-size="12" text-anchor="middle">P</text>
    <text x="968" y="272" fill="#cbd5e1" font-size="10" text-anchor="middle">Purnendu (Host)</text>

    <rect x="1054" y="195" width="140" height="90" rx="6" fill="#0f172a" stroke="#334155"/>
    <circle cx="1124" cy="235" r="16" fill="#10b981"/>
    <text x="1124" y="240" fill="#fff" font-size="12" text-anchor="middle">A</text>
    <text x="1124" y="272" fill="#cbd5e1" font-size="10" text-anchor="middle">Alex (Speaker)</text>

    <!-- Global Chat Section -->
    <text x="898" y="325" fill="#94a3b8" font-size="12" font-weight="bold">ROOM CHAT</text>
    <rect x="898" y="340" width="296" height="240" rx="6" fill="#0d1117" stroke="#1e293b"/>
    <text x="912" y="370" fill="#38bdf8" font-size="11" font-weight="bold">Alex:</text>
    <text x="950" y="370" fill="#e2e8f0" font-size="11">Synced state in 8ms!</text>
    <text x="912" y="405" fill="#4ade80" font-size="11" font-weight="bold">Purnendu:</text>
    <text x="980" y="405" fill="#e2e8f0" font-size="11">AABB collision active.</text>
    <text x="912" y="440" fill="#94a3b8" font-size="11" font-style="italic">System: STUN peer connected directly.</text>

    <!-- Chat input -->
    <rect x="898" y="595" width="296" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="912" y="619" fill="#64748b" font-size="11">Send message to space...</text>
  </g>
</svg>
